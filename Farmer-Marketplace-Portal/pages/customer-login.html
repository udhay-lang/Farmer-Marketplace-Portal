<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login &mdash; FarmConnect</title>
<link rel="icon" href="../assets/images/logo.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="">

<div id="navbar-mount"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> / Customer Login</div>
    <h1 style="margin-bottom:.4rem;">Welcome back</h1>
    <p style="margin-bottom:0;">Log in to continue shopping and track your orders.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="form-card">
      <form id="customerLoginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
          <span class="error-text">Enter a valid email address.</span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required>
          <span class="error-text">Incorrect email or password.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
        <p class="form-foot">New here? <a href="customer-register.html" style="color:var(--forest-800);font-weight:700;">Create an account</a></p>
        <p class="form-foot">Are you a farmer? <a href="farmer-login.html" style="color:var(--forest-800);font-weight:700;">Farmer login</a></p>
      </form>
      <hr class="divider">
      <p class="text-muted text-center" style="font-size:.82rem;">Demo account: arjun@mail.com / customer123</p>
    </div>
  </div>
</section>

<div id="footer-mount"></div>

<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
